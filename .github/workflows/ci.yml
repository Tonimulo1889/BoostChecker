name: BoostChecker CI / Package Integrity Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Scripts & Core Decryption Integrity
        shell: powershell
        run: |
          Write-Host "Verifying Run.ps1 and Launch.ps1 syntax..."
          $err1 = $null; [System.Management.Automation.Language.Parser]::ParseFile("./Run.ps1", [ref]$null, [ref]$err1)
          if ($err1.Count -gt 0) { throw "Run.ps1 has parse errors: $err1" }

          $err2 = $null; [System.Management.Automation.Language.Parser]::ParseFile("./Launch.ps1", [ref]$null, [ref]$err2)
          if ($err2.Count -gt 0) { throw "Launch.ps1 has parse errors: $err2" }

          Write-Host "Verifying encrypted Core package integrity..."
          if (-not (Test-Path "./Core/BoostCore.pkg")) {
            throw "Core/BoostCore.pkg is missing!"
          }

          $encryptedBytes = [System.IO.File]::ReadAllBytes("./Core/BoostCore.pkg")
          $aesKey = [System.Security.Cryptography.SHA256]::Create().ComputeHash([System.Text.Encoding]::UTF8.GetBytes("BoostRoleplay_2026_KernelCore_EncryptionKey!#"))
          $aesIv  = [byte[]]@(0x2A, 0x5F, 0x11, 0x9B, 0x44, 0xEE, 0x33, 0x12, 0x77, 0x88, 0x99, 0xAA, 0xBB, 0xCC, 0xDD, 0xEE)

          $aes = [System.Security.Cryptography.Aes]::Create()
          $aes.Key = $aesKey
          $aes.IV = $aesIv
          $aes.Mode = [System.Security.Cryptography.CipherMode]::CBC
          $aes.Padding = [System.Security.Cryptography.PaddingMode]::PKCS7

          $decryptor = $aes.CreateDecryptor()
          $compressedBytes = $decryptor.TransformFinalBlock($encryptedBytes, 0, $encryptedBytes.Length)
          $aes.Dispose()

          $msIn = [System.IO.MemoryStream]::new($compressedBytes)
          $gz = [System.IO.Compression.GZipStream]::new($msIn, [System.IO.Compression.CompressionMode]::Decompress)
          $msOut = [System.IO.MemoryStream]::new()
          $gz.CopyTo($msOut)
          $gz.Dispose()
          $msIn.Dispose()

          $coreCode = [System.Text.Encoding]::UTF8.GetString($msOut.ToArray())
          $msOut.Dispose()

          if ($coreCode.Length -lt 500000) {
            throw "Core payload suspiciously small ($($coreCode.Length) bytes)!"
          }

          Write-Host "[OK] BoostCore.pkg verified: $($coreCode.Length) bytes decrypted cleanly in memory."
